name: Supabase keepalive

# O plano grátis do Supabase pausa o projeto após ~7 dias sem uso. Este ping lê 1 linha a cada 3 dias.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve (limit 1)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltam os secrets SUPABASE_URL e/ou SUPABASE_PUBLISHABLE_KEY"; exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.json; exit 1
          fi
